<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Танковый турнир</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f0a; --panel:#1a1d15; --panel2:#232819; --line:#3a4230; --steel:#4b5440;
  --text:#ece9d8; --muted:#9c9d86; --accent:#f2b01e; --accent2:#c98a0c;
  --win:#7bd35f; --lose:#ff5a3c; --pend:#86b6ea;
  --gold:#f5c542; --silver:#c9d1d9; --bronze:#d08a4b;
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:15px/1.45 Rubik,system-ui,sans-serif;min-height:100vh;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 60% 40% at 15% 20%, rgba(74,86,48,.35), transparent 70%),
    radial-gradient(ellipse 50% 35% at 85% 10%, rgba(92,74,40,.30), transparent 70%),
    radial-gradient(ellipse 70% 50% at 70% 80%, rgba(52,64,36,.35), transparent 70%),
    radial-gradient(ellipse 40% 30% at 20% 85%, rgba(70,58,34,.30), transparent 70%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px);
  background-attachment:fixed}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3,.stencil{font-family:"Russo One",Rubik,sans-serif;font-weight:400;margin:0;text-transform:uppercase;letter-spacing:1px}
h2{font-size:18px;margin:28px 0 12px;display:flex;align-items:center;gap:10px;color:var(--accent)}
h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}

.hazard{height:10px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,#16140c 14px 28px);border-radius:3px}
.armor{position:relative;background:linear-gradient(180deg,#252a1c,#1a1d14);border:1px solid var(--line);border-radius:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -2px 0 rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.45)}
.armor::before,.armor::after{content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#8d9479,#3a3f30 70%);box-shadow:0 1px 1px rgba(0,0,0,.6)}
.armor::before{left:8px}.armor::after{right:8px}

/* hero */
.hero{padding:22px 24px 18px;margin-bottom:6px;overflow:hidden}
.hero .kicker{font-family:"Russo One";color:var(--muted);font-size:12px;letter-spacing:3px;text-transform:uppercase}
.hero h1{font-size:clamp(26px,5vw,44px);color:var(--text);text-shadow:0 2px 0 #000,0 0 24px rgba(242,176,30,.25);margin:4px 0 10px}
.hero h1 span{color:var(--accent)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:#2d3322;border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--text)}
.hero svg.tank{position:absolute;right:-10px;bottom:-6px;width:240px;opacity:.10;pointer-events:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}

button,.btn{background:linear-gradient(180deg,#2e3423,#232819);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;transition:border-color .15s,transform .05s}
button:hover{border-color:var(--accent)}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(180deg,#f7c040,#d4920e);color:#1a1405;border-color:#f7c040;font-family:"Russo One";text-transform:uppercase;letter-spacing:.5px;box-shadow:0 3px 0 #7a5306}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--lose)}
button.small{padding:4px 10px;font-size:13px}
input,select,textarea{background:#0b0d08;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,176,30,.15)}
input[type=number]{width:100%;max-width:140px;font-variant-numeric:tabular-nums;font-weight:600}
input:disabled,select:disabled{opacity:.85}
.muted{color:var(--muted)}
.banner{background:#16222e;border:1px solid #2f4a63;color:#cfe2f5;padding:10px 14px;border-radius:10px;margin-bottom:14px}

/* podium */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:12px;margin-bottom:14px}
.pod{text-align:center;padding:18px 10px 0;overflow:hidden}
.pod .medal{font-size:34px;line-height:1}
.pod .nm{font-family:"Russo One";font-size:18px;margin:6px 0 2px;word-break:break-word}
.pod .sc{font-family:"Russo One";font-size:26px}
.pod .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.pod .base{margin:12px -10px 0;font-family:"Russo One";font-size:26px;line-height:1;color:rgba(0,0,0,.35);padding:8px 0;box-sizing:border-box}
.pod.g{border-color:var(--gold);box-shadow:0 0 28px rgba(245,197,66,.18),0 6px 18px rgba(0,0,0,.45)}
.pod.g .sc{color:var(--gold)} .pod.g .base{background:linear-gradient(180deg,#f5c542,#b8860b);height:90px}
.pod.s .sc{color:var(--silver)} .pod.s .base{background:linear-gradient(180deg,#c9d1d9,#7d8590);height:60px}
.pod.b .sc{color:var(--bronze)} .pod.b .base{background:linear-gradient(180deg,#d08a4b,#8a5322);height:40px}

/* leaderboard table */
.ltable{overflow:hidden}
.lt-row{display:grid;grid-template-columns:56px 1fr 90px 90px 90px 110px 120px;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid #2a3021}
.lt-row:last-child{border-bottom:none}
.lt-row.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;background:rgba(0,0,0,.25);padding-top:16px}
.lt-row .rk{font-family:"Russo One";font-size:20px;text-align:center;width:40px;height:40px;line-height:38px;border-radius:8px;background:#2a3021;border:1px solid var(--line)}
.lt-row.r1 .rk{background:var(--gold);color:#2a1d00;border-color:var(--gold)}
.lt-row.r2 .rk{background:var(--silver);color:#1b1f24;border-color:var(--silver)}
.lt-row.r3 .rk{background:var(--bronze);color:#2a1505;border-color:var(--bronze)}
.lt-row .nm{font-weight:700;font-size:17px}
.lt-row .num{text-align:right;font-variant-numeric:tabular-nums}
.lt-row .tot{font-family:"Russo One";font-size:22px;text-align:right;color:var(--accent)}
.bar{height:4px;background:#2a3021;border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.betdots{display:inline-flex;gap:3px;vertical-align:middle}
.betdots i{width:9px;height:9px;border-radius:2px;background:var(--accent);display:inline-block}
.betdots i.u{background:#3a4230}

/* tabs */
.tabs{display:flex;gap:4px;margin:30px 0 14px;border-bottom:2px solid var(--line)}
.tab{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:0;padding:10px 16px;color:var(--muted);font-family:"Russo One";font-size:15px;text-transform:uppercase;letter-spacing:1px;box-shadow:none}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab.final{color:#ff7a4d}
.tab.final.on{color:#ff7a4d;border-bottom-color:#ff7a4d;text-shadow:0 0 12px rgba(255,90,60,.5)}
.tag.fire{background:#4a1a10;color:#ff7a4d}
.tab:hover{color:var(--text)}

/* rounds */
.rules{font-size:13px;color:var(--muted);background:rgba(0,0,0,.25);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0}
.rounds{display:grid;gap:14px}
.round{overflow:hidden}
.rhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px 12px 24px;background:linear-gradient(90deg,#2e3523,#20251a);border-bottom:1px solid var(--line)}
.rhead h3{font-size:16px;margin-right:auto;color:var(--accent)}
.prow{display:grid;grid-template-columns:minmax(110px,1.3fr) 90px minmax(90px,1fr) 110px minmax(120px,1.2fr);gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid #262b20}
.prow:last-child{border-bottom:none}
.prow.s2{grid-template-columns:minmax(110px,1.3fr) minmax(90px,1fr) 110px minmax(120px,1.2fr)}
.prow.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding-top:7px;padding-bottom:7px;background:rgba(0,0,0,.2)}
.pname{font-weight:600}
.tag{display:inline-block;font-family:Rubik;font-size:11px;padding:1px 8px;border-radius:99px;background:#3a3215;color:var(--accent);margin-left:6px;vertical-align:middle;text-transform:none;letter-spacing:0}
.pts{text-align:right;font-variant-numeric:tabular-nums}
.pts b{font-size:18px;font-family:"Russo One";font-weight:400}
.pts .calc{display:block;font-size:12px;color:var(--muted)}
.bet{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.bet input{width:18px;height:18px;accent-color:var(--accent)}
.bet.off{opacity:.35;cursor:not-allowed}
.win{color:var(--win)} .lose{color:var(--lose)} .pend{color:var(--pend)}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0 16px}
.cat{padding:10px 12px 10px 22px;font-size:14px;font-weight:600}
.cat::before,.cat::after{display:none}
.cat{border-left:4px solid var(--accent)}
.cat.done{opacity:.45;border-left-color:var(--steel)}
.cat .cnt{float:right;color:var(--accent);font-family:"Russo One"}
.cat .who{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-weight:400}

/* setup */
.setup{max-width:580px;margin:30px auto;display:grid;gap:16px;padding:26px}
.setup h1{font-size:28px;color:var(--accent)}
.setup label{display:grid;gap:6px;font-weight:600}
.plist{display:grid;gap:8px}
.plist .pi{display:grid;grid-template-columns:34px 1fr 36px;gap:8px;align-items:center}
.plist .pi span{font-family:"Russo One";text-align:center;color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:#1a1405;padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* collapsed battle */
.round{position:relative}
.round.closed .rhead{background:linear-gradient(90deg,#26301d,#1d2217)}
.tag.ok{background:#1f3318;color:var(--win)}
button.ghost{background:transparent;border-color:transparent;padding:4px 8px;opacity:.7}
button.ghost:hover{opacity:1;border-color:var(--line)}
.sum{display:grid;gap:2px;padding:8px 16px 4px}
.sp{display:grid;grid-template-columns:28px minmax(80px,1fr) auto 90px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed #2a3021}
.sp:last-child{border-bottom:none}
.sp .m{font-size:18px;text-align:center}
.sp .n{font-weight:600}
.sp .n small{color:var(--muted);font-weight:400}
.sp .e{font-size:13px;color:var(--muted);text-align:right}
.sp b{font-family:"Russo One";font-weight:400;font-size:18px;text-align:right}
.sp.top b{color:var(--accent)}
.quip{margin:4px 16px 12px;padding:8px 12px;font-size:13px;background:rgba(0,0,0,.25);border-radius:8px;color:#d7d3bd}
.quip b{color:var(--text)}
.rfoot{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:10px 16px;background:rgba(0,0,0,.18)}
.rfoot .hint{font-size:12px;margin-right:auto}
button.primary:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed;box-shadow:none}

.prog{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:13px;color:var(--muted)}
.prog-bar{flex:1;height:8px;background:#20251a;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,var(--accent2) 8px 16px);background-size:22px 22px;animation:march 1s linear infinite;transition:width .6s cubic-bezier(.2,.8,.2,1)}
@keyframes march{to{background-position:22px 0}}

/* stamp + shake */
.stamp{position:absolute;right:24px;top:50%;font-family:"Russo One";font-size:30px;letter-spacing:3px;color:var(--lose);border:4px solid var(--lose);border-radius:8px;padding:2px 14px;transform:translateY(-50%) rotate(-12deg);pointer-events:none;mix-blend-mode:screen;animation:stamp 1.8s ease forwards}
@keyframes stamp{0%{opacity:0;transform:translateY(-50%) rotate(-12deg) scale(3)}12%{opacity:1;transform:translateY(-50%) rotate(-12deg) scale(.95)}18%{transform:translateY(-50%) rotate(-12deg) scale(1)}75%{opacity:1}100%{opacity:0}}
.round.just{animation:land .45s ease}
@keyframes land{0%{transform:scale(1.02)}40%{transform:scale(.985)}100%{transform:none}}
.shake{animation:shake .5s ease}
@keyframes shake{20%{transform:translateX(-8px) rotate(-.5deg)}40%{transform:translateX(7px) rotate(.4deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.confetti{position:fixed;width:8px;height:12px;border-radius:2px;z-index:50;pointer-events:none}
.floater{position:fixed;z-index:50;font-size:22px;pointer-events:none}

/* leaderboard extras */
.badge{display:inline-block;font-family:Rubik;font-size:11px;font-weight:500;padding:1px 8px;margin-left:6px;border-radius:99px;background:#2d3322;border:1px solid var(--line);color:#d7d3bd;vertical-align:middle;white-space:nowrap}
.lt-row{position:relative;background:transparent}
.lt-row.r1{background:linear-gradient(100deg,transparent 30%,rgba(245,197,66,.10) 45%,transparent 60%) 0 0/250% 100%;animation:sheen 4s linear infinite}
@keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
.lt-row.moved{box-shadow:inset 3px 0 0 var(--accent)}
.bump{animation:bump .7s ease}
@keyframes bump{30%{transform:scale(1.12);color:#fff}}
.crown{display:block;font-size:22px;margin-bottom:-6px;animation:crown 2.4s ease-in-out infinite}
@keyframes crown{50%{transform:translateY(-4px) rotate(-6deg)}}
.leader-pop{position:fixed;left:50%;top:40%;z-index:60;transform:translate(-50%,-50%);text-align:center;background:linear-gradient(180deg,#2b2410,#1a1d14);border:2px solid var(--gold);border-radius:14px;padding:18px 34px;box-shadow:0 0 60px rgba(245,197,66,.35),0 20px 40px rgba(0,0,0,.6);animation:pop 2.6s ease forwards;pointer-events:none}
.lp-k{font-family:"Russo One";font-size:12px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.lp-n{font-family:"Russo One";font-size:30px;color:var(--gold)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}

/* first load entrance */
body.first .pod{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
body.first .pod:nth-child(1){animation-delay:.15s}
body.first .pod:nth-child(3){animation-delay:.3s}
body.first .lt-row:not(.head){animation:slidein .5s ease both}
body.first .lt-row:nth-child(3){animation-delay:.08s} body.first .lt-row:nth-child(4){animation-delay:.16s} body.first .lt-row:nth-child(5){animation-delay:.24s}
body.first .round{animation:slidein .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
@keyframes slidein{from{opacity:0;transform:translateX(-16px)}}

/* radio + tank easter egg */
.radio{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13px;color:#d7d3bd;max-width:calc(100% - 150px)}
.radio .rlbl{flex:none;font-family:"Russo One";font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);background:#2b2410;border:1px solid #4a3c14;border-radius:4px;padding:2px 8px}
#radio{transition:opacity .35s,transform .35s}
#radio.out{opacity:0;transform:translateY(6px)}
.hero svg.tank{pointer-events:auto;cursor:crosshair;transform:scaleX(-1);transition:opacity .2s}
.hero svg.tank:hover{opacity:.22}
.hero.recoil svg.tank{animation:recoil .35s ease}
@keyframes recoil{30%{transform:scaleX(-1) translateX(-10px)}}
.flash{position:absolute;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#fff6c8,#f2b01e 40%,rgba(242,80,30,.6) 60%,transparent 70%);animation:flash .3s ease-out forwards;pointer-events:none}
@keyframes flash{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.shell{position:absolute;width:18px;height:6px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#fff3b0,#f2b01e);box-shadow:0 0 12px #f2b01e;pointer-events:none}
.bah{position:absolute;font-family:"Russo One";font-size:34px;color:var(--accent);text-shadow:0 3px 0 #000;animation:bah .8s ease-out forwards;pointer-events:none}
@keyframes bah{0%{opacity:0;transform:scale(.4) rotate(-8deg)}20%{opacity:1;transform:scale(1.15) rotate(-8deg)}100%{opacity:0;transform:scale(1) translateY(-20px) rotate(-8deg)}}

@media (max-width:700px){
  .sp{grid-template-columns:24px 1fr auto;}
  .sp .e{grid-column:2/3;text-align:left;margin-top:-6px}
  .sp b{grid-column:3;grid-row:1}
  .radio{max-width:100%}
  .stamp{font-size:22px;right:12px}
}
/* cards */
.prow.s2{grid-template-columns:minmax(110px,1.2fr) minmax(90px,1fr) minmax(140px,1.3fr) minmax(120px,1.2fr)}
.cardbtn{border-style:dashed;color:var(--accent)}
.cardbtn small{background:#3a3215;border-radius:99px;padding:0 6px;margin-left:4px;font-size:11px}
.cardbtn.on{border-style:solid;border-color:var(--accent);background:#2b2410}
.cardchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 6px 4px 10px;border-radius:8px;background:linear-gradient(180deg,#3d3315,#2b2410);border:1px solid #7a5f1a;color:var(--gold);box-shadow:0 2px 0 #000}
.cardchip .x{padding:0 6px;font-size:11px;background:transparent;border:none;color:var(--muted)}
.cardchip .x:hover{color:var(--lose)}
.cardchip.flip{animation:cflip .6s ease}
@keyframes cflip{0%{transform:perspective(400px) rotateY(90deg) scale(.8)}60%{transform:perspective(400px) rotateY(-10deg) scale(1.08)}100%{transform:none}}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px 16px 12px;background:rgba(0,0,0,.28);border-bottom:1px solid #262b20;animation:slidein .25s ease}
.picker.tg{display:flex;flex-wrap:wrap;align-items:center}
.pk-l{font-weight:600;color:var(--gold);margin-right:6px}
.copt{display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto;column-gap:6px;text-align:left;padding:8px 10px;border-radius:10px;background:linear-gradient(180deg,#2e2a17,#1e1c10);border-color:#5a4a1a}
.copt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.5)}
.copt .ci{grid-row:1/3;font-size:22px;align-self:center;text-align:center}
.copt .cn{font-weight:700;font-size:14px;color:var(--gold)}
.copt .cd{font-size:11px;color:var(--muted);line-height:1.25}
.copt:disabled{opacity:.35;cursor:not-allowed}
.xrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:4px 16px 10px;border-bottom:1px solid #262b20;font-size:13px;color:var(--muted)}
.xin{display:flex;align-items:center;gap:6px}
.xin input[type=number]{width:96px;padding:5px 8px}
.cb{display:inline-block;font-size:12px;padding:0 8px;border-radius:99px;background:#2b2410;border:1px solid #5a4a1a;color:var(--gold);margin-right:4px}
.cb.win{border-color:var(--win)} .cb.lose{border-color:var(--lose);opacity:.8} .cb.pending{border-color:var(--pend)}
.heban{padding:8px 16px 8px 24px;font-size:13px;color:#ffb199;background:repeating-linear-gradient(-45deg,rgba(255,90,60,.16) 0 12px,rgba(255,90,60,.06) 12px 24px);border-bottom:1px solid #5a2a1a}
.heban b{color:#ff7a4d}
.cleft{font-size:13px;color:var(--gold);white-space:nowrap}
.hands{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:12px 0 16px}
.hand{padding:10px 14px 10px 22px}
.hand::before,.hand::after{display:none}
.hand .hn{font-weight:700;display:flex;justify-content:space-between}
.hand .hn span{color:var(--gold);font-size:13px;font-weight:600}
.hc{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

  input[type=number]{max-width:none}

}

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="sync" id="sync" hidden></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const KEY = 'tank-tourney-v1';
const LEVELS = [3,4,5,6,7,8,9,10];
let S = null;        // state
let VIEW = false;    // read-only viewer mode
let TAB = 1;
let EDITING = false; // setup form open for existing tournament
let PICK = null;     // open card picker {rid, pid, card?} (UI only)

const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmt = n => Math.round(n).toLocaleString('ru-RU');
const $ = s => document.querySelector(s);

function defaultCats(n) {
  return [
    {id:'sth', name:'Сверхтяж', slots:1},
    {id:'tt',  name:'ТТ',       slots:1},
    {id:'st',  name:'СТ',       slots:1},
    {id:'art', name:'Арта',     slots:n, unique:true},
    {id:'lt',  name:'ЛТ',       slots:n, unique:true},
    {id:'pt',  name:'ПТ',       slots:1},
    {id:'bt7', name:'БТ-7 арт.',slots:1},
    {id:'kv2', name:'КВ-2',     slots:1},
  ];
}

const AKEY = 'tank-tourney-admin-key';
let API_OK = false, pushT = null, lastRemote = '';
function save() {
  if (VIEW) return;
  if (S) S.updatedAt = Date.now();
  try { S ? localStorage.setItem(KEY, JSON.stringify(S)) : localStorage.removeItem(KEY); } catch (e) {}
  if (API_OK) { clearTimeout(pushT); setSync('wait'); pushT = setTimeout(push, 600); }
}
function adminKey(ask) {
  let k = null; try { k = localStorage.getItem(AKEY); } catch (e) {}
  if (!k || ask) {
    k = prompt('Пароль ведущего (ADMIN_KEY из настроек Vercel):', '') || '';
    try { localStorage.setItem(AKEY, k); } catch (e) {}
  }
  return k;
}
async function push() {
  try {
    const r = await fetch('/api/state', {method: 'POST', headers: {'Content-Type': 'application/json', 'x-admin-key': adminKey()}, body: JSON.stringify({state: S})});
    if (r.status === 401) { try { localStorage.removeItem(AKEY); } catch (e) {} return setSync('auth'); }
    setSync(r.ok ? 'ok' : 'err');
  } catch (e) { setSync('err'); }
}
function setSync(st) {
  const el = $('#sync'); if (!el) return;
  const t = {ok: '☁️ Зрители видят актуальное', wait: '⏳ Отправка…', err: '⚠️ Нет связи — нажми, чтобы повторить', auth: '🔒 Неверный пароль — нажми, чтобы ввести', live: '🔴 LIVE · обновляется автоматически', off: '💾 Только локально (нет сервера)'}[st];
  el.textContent = t; el.className = 'sync ' + st; el.hidden = false;
}
async function fetchRemote() {
  const r = await fetch('/api/state', {cache: 'no-store'});
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).state;
}
function startPolling() {
  setInterval(async () => {
    try {
      const st = await fetchRemote(); const str = JSON.stringify(st);
      setSync('live');
      if (str !== lastRemote) { lastRemote = str; S = ensureStage1(st); render(); }
    } catch (e) { setSync('err'); }
  }, 4000);
}
function loadLocal() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }

const cat = id => S.categories.find(c => c.id === id);
const FINAL_X = 2; // everyone gets x2 in the final
const pickLvl = r => r.pick?.startsWith('lvl:') ? +r.pick.slice(4) : null;
const pickCat = r => r.pick?.startsWith('cat:') ? cat(r.pick.slice(4)) : null;
function pickLabel(r) {
  const l = pickLvl(r), c = pickCat(r);
  return l ? `${l} уровень (×${(l / 10).toFixed(1)})` : c ? c.name : 'тип не выбран';
}
const STAGE_NAME = {1: 'I', 2: 'II', 3: 'Финал'};

/* ---------------- cards ---------------- */
const CARDS = {
  double: {i: '✖️2', n: 'Удвоение',     d: 'очки за бой ×2'},
  bet:    {i: '🎰', n: 'Ставка',        d: 'первый по опыту — ×2, иначе ×0'},
  turtle: {i: '🐢', n: 'Черепаха',      d: 'выжил до конца боя — +50%'},
  dmg:    {i: '💥', n: 'Урон',          d: 'больше всех урона — +50%'},
  blk:    {i: '🛡️', n: 'Танкист',       d: 'больше всех заблокировал бронёй — +50%'},
  spot:   {i: '🔦', n: 'Светляк',       d: 'больше всех урона по засвету — +50%'},
  frag:   {i: '💀', n: 'Мясник',        d: 'больше всех фрагов — +50%'},
  nav:    {i: '🧭', n: 'Штурман',       d: 'выбираешь, на какое направление едет весь взвод'},
  swap:   {i: '🔄', n: 'Обмен',         d: 'после боя меняешься опытом с соперником', target: true},
  duel:   {i: '⚔️', n: 'Дуэль',         d: 'у кого больше опыта — забирает 25% очков другого', target: true},
  he:     {i: '🧨', n: 'Только фугасы', d: 'на весь бой: все (и ты) едут только на фугасах, первый по опыту — ×1.5'},
  pick:   {i: '🎯', n: 'Выбор танка',   d: 'выбираешь сопернику танк; если он всё равно первый — ×1.5', target: true},
};
const DECK = {
  1: ['bet', 'turtle', 'dmg', 'frag', 'nav', 'he', 'duel'],
  2: ['double', 'bet', 'turtle', 'dmg', 'blk', 'spot', 'frag', 'nav', 'swap', 'duel', 'he', 'pick'],
  3: [],
};
const STAT = {dmg: {i: '💥', n: 'урон'}, blk: {i: '🛡️', n: 'блок'}, spot: {i: '🔦', n: 'засвет'}, frag: {i: '💀', n: 'фраги'}};
const UNIQUE_OK = ['double', 'bet', 'turtle'];
const isUniqueRound = r => r.stage === 2 && !!cat(r.catId)?.unique;
const cardOf = (r, pid) => r.stage !== 3 && CARDS[r.r[pid]?.card] ? r.r[pid].card : null;
const roundShort = r => r.stage === 1 ? `${r.lvl} ур.` : r.stage === 3 ? 'финал' : `${cat(r.catId)?.name || '?'}${cat(r.catId)?.unique ? ' · ' + pName(r.chooser) : ''}`;
// round where this player already spent the card in this stage (other than `except`)
const playedIn = (pid, stage, card, except) => S.rounds.find(r => r.stage === stage && r.id !== except && r.r[pid]?.card === card);
const cardsLeft = (pid, stage) => DECK[stage].filter(id => !playedIn(pid, stage, id)).length;
// who is already the target of someone's card in this round
const targetedBy = (r, tid, except) => S.players.find(o => o.id !== except && CARDS[cardOf(r, o.id)]?.target && r.r[o.id].tgt === tid);
function availTargets(r, pid) { return S.players.filter(o => o.id !== pid && !targetedBy(r, o.id, pid)); }
function whyNot(r, pid, id) {
  if (playedIn(pid, r.stage, id, r.id)) return 'уже сыграна';
  if (isUniqueRound(r) && !UNIQUE_OK.includes(id)) return 'не работает на уникальном бою';
  const others = S.players.filter(o => o.id !== pid).map(o => cardOf(r, o.id));
  if (id === 'swap' && others.includes('double')) return 'нельзя в бою с Удвоением';
  if (id === 'double' && others.includes('swap')) return 'нельзя в бою с Обменом';
  if (id === 'he' && others.includes('he')) return 'фугасы уже объявлены';
  if (CARDS[id].target && !availTargets(r, pid).length) return 'все соперники уже под картой';
  return '';
}
const needsOf = r => Object.keys(STAT).filter(f => S.players.some(p => cardOf(r, p.id) === f));
const pName = id => S.players.find(p => p.id === id)?.name ?? '?';
const cell = (r, pid) => (r.r[pid] ||= {exp: ''});

// stage 1 = one battle per level 3..10 (everyone on the same level)
function ensureStage1(st) {
  if (!st) return st;
  for (const lvl of LEVELS) {
    if (!st.rounds.some(r => r.stage === 1 && r.lvl === lvl)) st.rounds.push({id: uid(), stage: 1, lvl, r: {}});
  }
  // drop leftovers from the old per-player-level format
  st.rounds = st.rounds.filter(r => r.stage !== 1 || LEVELS.includes(r.lvl));

  // stage 2 = fixed battles: one per common category, one per player for unique classes (art, LT)
  const n = st.players.length;
  for (const c of st.categories) if (c.unique) c.slots = n;
  const keep = [];
  let common = 0;
  for (const c of st.categories) {
    const mine = st.rounds.filter(r => r.stage === 2 && r.catId === c.id);
    for (let k = 0; k < c.slots; k++) {
      let r = mine.find(x => x.slot === k) || mine.find(x => x.slot == null);
      if (!r) r = {id: uid(), stage: 2, catId: c.id, r: {}};
      r.slot = k;
      if (c.unique) r.chooser = st.players[k]?.id;
      else if (!st.players.some(p => p.id === r.chooser)) r.chooser = st.players[common % n]?.id;
      if (!c.unique) common++;
      keep.push(r);
    }
  }
  // stage 3 = final: one battle per player, the player picks any battle type
  st.betLimits[3] = 0; // no bets in the final
  const finals = st.players.map((p, k) => {
    const r = st.rounds.find(x => x.stage === 3 && x.chooser === p.id) || {id: uid(), stage: 3, pick: '', r: {}};
    r.chooser = p.id; r.slot = k; return r;
  });
  st.rounds = st.rounds.filter(r => r.stage === 1).concat(keep, finals);
  // old format: bet checkbox -> "Ставка" card
  for (const r of st.rounds) for (const c of Object.values(r.r || {})) {
    if (c.bet && !c.card) c.card = 'bet';
    delete c.bet;
  }
  return st;
}

/* ---------------- scoring ---------------- */
// bet: "I'll be first by experience". eff = experience after swaps in this round
function betStatus(r, p, eff) {
  const me = eff[p.id];
  if (me == null) return 'pending';
  const others = S.players.filter(o => o.id !== p.id);
  const c = r.stage === 2 ? cat(r.catId) : null;
  const vals = [];
  if (c?.unique && r.chooser === p.id) {
    // compare with other players' own battles in this unique class
    for (const o of others) {
      const rr = S.rounds.find(x => x.stage === 2 && x.catId === r.catId && x.chooser === o.id && num(x.r[o.id]?.exp) != null);
      if (!rr) return 'pending';
      vals.push(num(rr.r[o.id].exp));
    }
  } else {
    for (const o of others) {
      if (eff[o.id] == null) return 'pending';
      vals.push(eff[o.id]);
    }
  }
  return !vals.length || me >= Math.max(...vals) ? 'win' : 'lose';
}

// order: swap (experience) -> level multiplier -> card bonuses -> duels (transfer of points)
function calcRound(r) {
  const P = S.players, res = {};
  const mult = r.stage === 1 ? (r.lvl || 10) / 10 : r.stage === 3 ? (pickLvl(r) ? pickLvl(r) / 10 : 1) * FINAL_X : 1;
  const C = Object.fromEntries(P.map(p => [p.id, cell(r, p.id)]));
  const raw = Object.fromEntries(P.map(p => [p.id, num(C[p.id].exp)]));
  const eff = {...raw}, swapped = {};
  for (const p of P) {
    const t = C[p.id].tgt;
    if (cardOf(r, p.id) === 'swap' && t in eff && eff[p.id] != null && eff[t] != null) {
      [eff[p.id], eff[t]] = [eff[t], eff[p.id]]; swapped[p.id] = t; swapped[t] = p.id;
    }
  }
  const known = P.every(p => eff[p.id] != null);
  const maxE = known ? Math.max(...P.map(p => eff[p.id])) : null;
  const first = pid => known && eff[pid] >= maxE;
  const he = P.some(p => cardOf(r, p.id) === 'he');
  const top = (pid, f) => { const vs = P.map(p => num(C[p.id][f])); return vs.some(v => v == null) ? null : num(C[pid][f]) >= Math.max(...vs); };
  for (const p of P) {
    if (eff[p.id] == null) { res[p.id] = null; continue; }
    const k = cardOf(r, p.id), mods = [];
    let factor = 1, status = null, cs = k ? 'played' : null;
    const m = (t, c, f = 1) => { mods.push({t, c}); factor *= f; };
    if (swapped[p.id]) m(`🔄 опыт ${pName(swapped[p.id])}`, 'pend');
    if (k === 'double') { m('✖️2 ×2', 'win', 2); cs = 'win'; }
    else if (k === 'bet') {
      status = cs = betStatus(r, p, eff);
      if (status === 'win') m('🎰 ×2', 'win', 2); else if (status === 'lose') m('🎰 ×0', 'lose', 0); else m('🎰 ⏳', 'pend');
    }
    else if (k === 'turtle') { cs = C[p.id].alive ? 'win' : 'lose'; cs === 'win' ? m('🐢 +50%', 'win', 1.5) : m('🐢 не выжил', 'lose'); }
    else if (STAT[k]) {
      const t = top(p.id, k); cs = t == null ? 'pending' : t ? 'win' : 'lose';
      t ? m(`${CARDS[k].i} +50%`, 'win', 1.5) : m(`${CARDS[k].i} ${t == null ? '⏳' : 'мимо'}`, t == null ? 'pend' : 'lose');
    }
    if (he && first(p.id)) m('🧨 ×1.5', 'win', 1.5);
    if (P.some(o => cardOf(r, o.id) === 'pick' && C[o.id].tgt === p.id) && first(p.id)) m('🎯 ×1.5', 'win', 1.5);
    const base = eff[p.id] * mult;
    res[p.id] = {exp: raw[p.id], eff: eff[p.id], mult, base, mods, status, cs, card: k, tgt: k && CARDS[k].target ? C[p.id].tgt : null, factor, pts: base * factor};
  }
  // duels: whoever has more experience takes 25% of the other's points for the battle
  const pre = Object.fromEntries(P.map(p => [p.id, res[p.id]?.pts ?? 0]));
  for (const p of P) {
    const a = res[p.id], t = C[p.id].tgt, b = res[t];
    if (cardOf(r, p.id) !== 'duel' || !a || !(t in raw)) continue;
    if (!b) { a.cs = 'pending'; a.mods.push({t: '⚔️ ⏳', c: 'pend'}); continue; }
    if (a.eff === b.eff) { a.cs = 'played'; a.mods.push({t: '⚔️ ничья', c: 'pend'}); b.mods.push({t: '⚔️ ничья', c: 'pend'}); continue; }
    const [w, l, lid] = a.eff > b.eff ? [a, b, t] : [b, a, p.id];
    const tr = 0.25 * pre[lid];
    w.pts += tr; l.pts -= tr;
    w.mods.push({t: `⚔️ +${fmt(tr)}`, c: 'win'}); l.mods.push({t: `⚔️ −${fmt(tr)}`, c: 'lose'});
    a.cs = a === w ? 'win' : 'lose';
    a.duel = b.duel = {w: a === w ? p.id : t, l: lid, tr};
  }
  return res;
}

function compute() {
  const R = {}, T = {};
  for (const p of S.players) T[p.id] = {s1:0, s2:0, s3:0, total:0, used:{1:0, 2:0, 3:0}, battles:0};
  for (const r of S.rounds) {
    R[r.id] = calcRound(r);
    for (const p of S.players) {
      if (cardOf(r, p.id)) T[p.id].used[r.stage]++;
      const x = R[r.id][p.id];
      if (!x) continue;
      T[p.id]['s' + r.stage] += x.pts;
      T[p.id].total += x.pts;
      T[p.id].battles++;
    }
  }
  return {R, T};
}


/* ---------------- markdown report ---------------- */
function download(text, name, type) {
  const blob = new Blob([text], {type: type + ';charset=utf-8'});
  const link = Object.assign(document.createElement('a'), {href: URL.createObjectURL(blob), download: name});
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

function reportMD() {
  const {R, T} = compute();
  const md = s => String(s ?? '').replace(/\|/g, '\\|');
  const N = id => md(pName(id));
  const list = ranked(T);
  const medal = pl => ['🥇', '🥈', '🥉'][pl - 1] || `${pl}.`;
  const date = new Date(S.updatedAt || Date.now()).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', year: 'numeric'});
  const s1 = S.rounds.filter(r => r.stage === 1).sort((a, b) => a.lvl - b.lvl);
  const s2 = S.rounds.filter(r => r.stage === 2);
  const s3 = S.rounds.filter(r => r.stage === 3);
  const played = r => S.players.some(p => R[r.id][p.id]);
  const roundName = r => r.stage === 1 ? `${r.lvl} ур.` : r.stage === 3 ? `${pickLabel(r)} (выбор ${pName(r.chooser)})` : `${cat(r.catId)?.name || '?'}${cat(r.catId)?.unique ? ' (' + pName(r.chooser) + ')' : ''}`;
  const csMark = cs => cs === 'win' ? '✅' : cs === 'lose' ? '❌' : cs === 'pending' ? '⏳' : '';
  const betMark = x => x?.card ? ` ${CARDS[x.card].i}${csMark(x.cs)}` : '';
  const out = [];
  const L = (...a) => out.push(...a);

  // ----- header & winner
  L(`# 🏆 ${md(S.name)}`, '', `> **Взводный турнир World of Tanks** · ${date} · ${S.players.length} танкиста · ${[...s1, ...s2, ...s3].filter(played).length} боёв`, '');
  const [w, second] = list;
  if (w && w.t.total > 0) {
    L(`## 👑 Победитель — ${N(w.p.id)}`, '');
    const gap = second ? w.t.total - second.t.total : 0;
    const tone = !second ? '' : gap === 0 ? 'Абсолютная ничья на вершине — делят первое место!' :
      gap < w.t.total * 0.05 ? `Победа в упор: отрыв от второго места (${N(second.p.id)}) всего **${fmt(gap)}** очков. Решило буквально несколько выстрелов.` :
      gap < w.t.total * 0.2 ? `Уверенная победа: **${fmt(gap)}** очков отрыва от второго места (${N(second.p.id)}).` :
      `Разгромная победа: второе место (${N(second.p.id)}) позади на **${fmt(gap)}** очков.`;
    L(`**${fmt(w.t.total)} очков** — ${tone}`, '');
  }

  // ----- standings
  L(`## 🎖 Итоговая таблица`, '', `| Место | Танкист | I ступень | II ступень | Финал | Карты | **Итого** |`, `|:---:|---|---:|---:|---:|:---:|---:|`);
  for (const {p, t, place} of list) {
    const played = S.rounds.flatMap(r => R[r.id][p.id]?.card ? [R[r.id][p.id]] : []);
    const bs = played.length ? played.map(x => CARDS[x.card].i + csMark(x.cs)).join(' ') : '—';
    L(`| ${medal(place)} | **${N(p.id)}** | ${fmt(t.s1)} | ${fmt(t.s2)} | ${fmt(t.s3)} | ${bs} | **${fmt(t.total)}** |`);
  }
  L('');

  // ----- progression
  const seq = [...s1, ...s2, ...s3].filter(played);
  if (seq.length) {
    L(`## 📈 Как шла гонка`, '', `Накопленные очки после каждого боя. Жирным — лидер на тот момент.`, '');
    L(`| # | Бой | ${S.players.map(p => N(p.id)).join(' | ')} | Лидер |`, `|---:|---|${S.players.map(() => '---:').join('|')}|---|`);
    const acc = Object.fromEntries(S.players.map(p => [p.id, 0]));
    let prevLeader = null; const swaps = [];
    seq.forEach((r, i) => {
      for (const p of S.players) acc[p.id] += R[r.id][p.id]?.pts || 0;
      const top = Math.max(...S.players.map(p => acc[p.id]));
      const leaders = S.players.filter(p => acc[p.id] === top).map(p => p.id);
      const lead = leaders.length > 1 ? 'ничья' : pName(leaders[0]);
      if (leaders.length === 1 && prevLeader && prevLeader !== leaders[0]) swaps.push(`${N(leaders[0])} выходит вперёд после боя «${md(roundName(r))}»`);
      if (leaders.length === 1) prevLeader = leaders[0];
      L(`| ${i + 1} | ${STAGE_NAME[r.stage]} · ${md(roundName(r))} | ${S.players.map(p => acc[p.id] === top ? `**${fmt(acc[p.id])}**` : fmt(acc[p.id])).join(' | ')} | ${md(lead)} |`);
    });
    L('');
    if (swaps.length) L(`**Смены лидера (${swaps.length}):**`, '', ...swaps.map(x => `- 🔄 ${x}`), '');
    else if (prevLeader) L(`🔒 ${N(prevLeader)} — лидер с первого боя и до самого конца.`, '');
  }

  // ----- stage 1
  if (s1.some(played)) {
    L(`## ⚔️ Первая ступень — с 3 по 10 уровень`, '', `Очки = опыт × множитель уровня. Формат ячейки: *опыт → очки*.`, '');
    L(`| Уровень | ×  | ${S.players.map(p => N(p.id)).join(' | ')} | Лучший |`, `|:---:|:---:|${S.players.map(() => '---:').join('|')}|---|`);
    for (const r of s1) {
      if (!played(r)) { L(`| ${r.lvl} | ×${(r.lvl / 10).toFixed(1)} | ${S.players.map(() => '—').join(' | ')} | не сыгран |`); continue; }
      const best = S.players.reduce((b, p) => (R[r.id][p.id]?.exp ?? -1) > (R[r.id][b.id]?.exp ?? -1) ? p : b);
      L(`| **${r.lvl}** | ×${(r.lvl / 10).toFixed(1)} | ${S.players.map(p => { const x = R[r.id][p.id]; return x ? `${fmt(x.exp)} → **${fmt(x.pts)}**${betMark(x)}` : '—'; }).join(' | ')} | ${N(best.id)} |`);
    }
    L('', `**Итог ступени:** ${list.slice().sort((a, b) => b.t.s1 - a.t.s1).map(x => `${N(x.p.id)} — ${fmt(x.t.s1)}`).join(' · ')}`, '');
  }

  // ----- stage 2
  if (s2.some(played)) {
    L(`## 🎯 Вторая ступень — категории`, '', `Без множителя уровня: сколько настрелял — столько и получил. Формат ячейки: *опыт → очки*.`, '');
    L(`| # | Категория | Выбирал | ${S.players.map(p => N(p.id)).join(' | ')} | Лучший |`, `|---:|---|---|${S.players.map(() => '---:').join('|')}|---|`);
    s2.forEach((r, i) => {
      const c = cat(r.catId);
      const best = S.players.reduce((b, p) => (R[r.id][p.id]?.exp ?? -1) > (R[r.id][b.id]?.exp ?? -1) ? p : b);
      L(`| ${i + 1} | ${md(c?.name)}${c?.unique ? ' ⭐' : ''} | ${N(r.chooser)} | ${S.players.map(p => { const x = R[r.id][p.id]; const me = p.id === r.chooser && c?.unique ? ' *(на ' + md(c.name) + ')*' : ''; return x ? `${fmt(x.exp)} → **${fmt(x.pts)}**${betMark(x)}${me}` : '—'; }).join(' | ')} | ${played(r) ? N(best.id) : '—'} |`);
    });
    L('', `⭐ — уникальный класс: каждый играет на нём сам.`, '');
    L(`**Итог ступени:** ${list.slice().sort((a, b) => b.t.s2 - a.t.s2).map(x => `${N(x.p.id)} — ${fmt(x.t.s2)}`).join(' · ')}`, '');
  }

  // ----- final
  if (s3.some(played)) {
    L(`## 🔥 Экстра-финал — бой на выбор, всё ×${FINAL_X}`, '', `Каждый танкист выбрал свой тип боя из любой ступени, а все очки удваивались. Формат ячейки: *опыт → очки*.`, '');
    L(`| # | Выбирал | Тип боя | ${S.players.map(p => N(p.id)).join(' | ')} | Лучший |`, `|---:|---|---|${S.players.map(() => '---:').join('|')}|---|`);
    s3.forEach((r, i) => {
      const best = S.players.reduce((b, p) => (R[r.id][p.id]?.exp ?? -1) > (R[r.id][b.id]?.exp ?? -1) ? p : b);
      L(`| ${i + 1} | ${N(r.chooser)} | ${md(pickLabel(r))} | ${S.players.map(p => { const x = R[r.id][p.id]; return x ? `${fmt(x.exp)} → **${fmt(x.pts)}**${betMark(x)}` : '—'; }).join(' | ')} | ${played(r) ? N(best.id) : '—'} |`);
    });
    L('', `**Итог финала:** ${list.slice().sort((a, b) => b.t.s3 - a.t.s3).map(x => `${N(x.p.id)} — ${fmt(x.t.s3)}`).join(' · ')}`, '');
  }

  // ----- bets
  const bets = [];
  for (const r of [...s1, ...s2, ...s3]) for (const p of S.players) { const x = R[r.id][p.id]; if (x?.status) bets.push({r, p, x}); }
  if (bets.length) {
    const won = bets.filter(b => b.x.status === 'win'), lost = bets.filter(b => b.x.status === 'lose');
    L(`## 🎲 Ставки «буду первым»`, '', `Сыграло **${won.length}** из ${bets.length}. Выигрыш удваивает очки за бой, проигрыш обнуляет.`, '');
  }

  // ----- cards
  const plays = [];
  for (const r of [...s1, ...s2]) for (const p of S.players) { const x = R[r.id][p.id]; if (x?.card) plays.push({r, p, x}); }
  if (plays.length) {
    const ok = plays.filter(a => a.x.cs === 'win').length, bad = plays.filter(a => a.x.cs === 'lose').length;
    L(`## 🃏 Розыгрыш карт`, '', `Сыграно карт: **${plays.length}** · сработали: **${ok}** · мимо: **${bad}**.`, '');
    L(`| Танкист | Бой | Карта | Итог | Опыт → очки |`, `|---|---|---|---|---:|`);
    for (const {r, p, x} of plays) {
      const k = CARDS[x.card];
      L(`| ${N(p.id)} | ${STAGE_NAME[r.stage]} · ${md(roundName(r))} | ${k.i} ${k.n}${x.tgt ? ' → ' + N(x.tgt) : ''} | ${csMark(x.cs) || '▶️'} ${x.mods.map(m => m.t).join(', ') || md(k.d)} | ${fmt(x.exp)} → **${fmt(x.pts)}** |`);
    }
    L('');
    const left = S.players.map(p => `${N(p.id)} — ${cardsLeft(p.id, 1) + cardsLeft(p.id, 2)}`).join(' · ');
    L(`Несыгранных карт (сгорают по итогам ступени): ${left}`, '');
  }

  // ----- highlights
  const all = [];
  for (const r of [...s1, ...s2, ...s3]) for (const p of S.players) { const x = R[r.id][p.id]; if (x) all.push({r, p, x}); }
  if (all.length) {
    L(`## 🔥 Яркие моменты`, '');
    const maxBy = (arr, f) => arr.reduce((b, a) => f(a) > f(b) ? a : b);
    const e = maxBy(all, a => a.x.exp);
    L(`- 💥 **Самый мощный бой:** ${N(e.p.id)} — ${fmt(e.x.exp)} опыта (${md(roundName(e.r))})`);
    const pt = maxBy(all, a => a.x.pts);
    if (pt !== e) L(`- 🏅 **Больше всего очков за бой:** ${N(pt.p.id)} — ${fmt(pt.x.pts)} (${md(roundName(pt.r))})`);
    const bw = bets.filter(b => b.x.status === 'win');
    if (bw.length) { const b = maxBy(bw, a => a.x.base); L(`- 🎰 **Лучшая ставка:** ${N(b.p.id)}, «${md(roundName(b.r))}» — +${fmt(b.x.base)} очков сверху`); }
    const bl = bets.filter(b => b.x.status === 'lose');
    if (bl.length) { const b = maxBy(bl, a => a.x.base); L(`- 💀 **Самый болезненный провал:** ${N(b.p.id)}, «${md(roundName(b.r))}» — ставка обнулила ${fmt(b.x.base)} очков`); }
    for (const c of S.categories.filter(c => c.unique)) {
      const own = s2.filter(r => r.catId === c.id && R[r.id][r.chooser]).map(r => ({p: r.chooser, exp: R[r.id][r.chooser].exp}));
      if (own.length) { const k = maxBy(own, a => a.exp); L(`- 👑 **Король класса «${md(c.name)}»:** ${N(k.p)} — ${fmt(k.exp)} опыта`); }
    }
    const lo = all.filter(a => a.x.exp > 0);
    if (lo.length > 1) { const m = lo.reduce((b, a) => a.x.exp < b.x.exp ? a : b); L(`- 🥔 **Самый тихий бой:** ${N(m.p.id)} — ${fmt(m.x.exp)} опыта (${md(roundName(m.r))}). Бывает.`); }
    const avg = S.players.map(p => { const xs = all.filter(a => a.p.id === p.id); return {p, v: xs.length ? xs.reduce((s, a) => s + a.x.exp, 0) / xs.length : 0}; });
    const ac = maxBy(avg, a => a.v);
    L(`- 📊 **Лучший средний опыт:** ${N(ac.p.id)} — ${fmt(ac.v)} за бой`, '');
  }

  L(`---`, '', `*Отчёт сгенерирован ${new Date().toLocaleString('ru-RU')} · Правила: I ступень — опыт × уровень/10, ${DECK[1].length} карт; II ступень — чистый опыт, ${DECK[2].length} карт; финал — бой на выбор ×${FINAL_X}, без карт.*`, '');
  return out.join('\n');
}

/* ---------------- share ---------------- */
async function shareLink() {
  const url = location.origin + location.pathname;
  try { await navigator.clipboard.writeText(url); toast('Ссылка для зрителей скопирована'); }
  catch (e) { prompt('Скопируй ссылку:', url); }
}

/* ---------------- render ---------------- */
function render() {
  const before = captureBoard();
  renderRaw();
  afterRender(before);
}

function renderRaw() {
  const app = $('#app');
  if (VIEW && !S) { app.innerHTML = `<div class="hazard"></div><section class="hero armor" style="margin-top:10px;text-align:center;padding:50px 20px"><div class="kicker">Взводный турнир · World of Tanks</div><h1>Турнир <span>скоро начнётся</span></h1><p class="muted">Страница обновится сама, как только ведущий создаст турнир.</p></section>`; return; }
  if (!S || EDITING) { app.innerHTML = setupHTML(); return; }
  const {R, T} = compute();
  app.innerHTML = `
    <div class="hazard"></div>
    <section class="hero armor" style="margin-top:10px">
      <div class="kicker">Взводный турнир · World of Tanks</div>
      <h1>${titleHTML(S.name)}</h1>
      <div class="meta">
        <span class="chip">Игроков: <b>${S.players.length}</b></span>
        <span class="chip">I ступень: <b>${S.rounds.filter(r=>r.stage===1).length}</b> боёв</span>
        <span class="chip">II ступень: <b>${S.rounds.filter(r=>r.stage===2).length}</b> боёв</span>
        <span class="chip">Финал ×${FINAL_X}: <b>${S.rounds.filter(r=>r.stage===3).length}</b> боя</span>
        ${VIEW ? '<span class="chip live">● LIVE</span>' : ''}
      </div>
      <div class="radio"><span class="rlbl">📻 Радио взвода</span><span id="radio">${RADIO[0]}</span></div>
      <svg class="tank" data-act="fire" viewBox="0 0 240 110" fill="currentColor"><rect x="20" y="62" width="200" height="30" rx="15"/><rect x="40" y="44" width="160" height="22" rx="4"/><rect x="80" y="22" width="80" height="26" rx="8"/><rect x="150" y="30" width="90" height="8" rx="3"/><g fill="#000"><circle cx="45" cy="77" r="9"/><circle cx="75" cy="77" r="9"/><circle cx="105" cy="77" r="9"/><circle cx="135" cy="77" r="9"/><circle cx="165" cy="77" r="9"/><circle cx="195" cy="77" r="9"/></g></svg>
    </section>
      ${VIEW ? `<div class="toolbar"><button data-act="report">📜 Отчёт о турнире (.md)</button></div>` : `<div class="toolbar">
        <button class="primary" data-act="share">🔗 Ссылка для зрителей</button>
        <button data-act="report">📜 Отчёт (.md)</button>
        <button data-act="edit">⚙️ Настройки</button>
        <button data-act="export">⬇️ Бэкап (.json)</button>
        <button data-act="import">⬆️ Импорт</button>
        <button class="danger" data-act="reset">Новый турнир</button>
      </div>`}
    <h2>Таблица лидеров</h2>
    <div id="board">${boardHTML(T)}</div>
    <div class="tabs">
      <button class="tab ${TAB===1?'on':''}" data-tab="1">Первая ступень</button>
      <button class="tab ${TAB===2?'on':''}" data-tab="2">Вторая ступень</button>
      <button class="tab final ${TAB===3?'on':''}" data-tab="3">🔥 Финал ×${FINAL_X}</button>
    </div>
    ${TAB === 1 ? stage1HTML(R, T) : TAB === 2 ? stage2HTML(R, T) : stage3HTML(R, T)}
  `;
}

function titleHTML(name) {
  const w = esc(name).split(' ');
  return w.length > 1 ? w.slice(0, -1).join(' ') + ' <span>' + w[w.length - 1] + '</span>' : '<span>' + w[0] + '</span>';
}

function ranked(T) {
  const sorted = [...S.players].sort((a, b) => T[b.id].total - T[a.id].total);
  let place = 0, prev = null;
  return sorted.map((p, i) => { const t = T[p.id]; if (t.total !== prev) { place = i + 1; prev = t.total; } return {p, t, place}; });
}

function leftHTML(pid) {
  const a = cardsLeft(pid, 1), b = cardsLeft(pid, 2);
  return `<span class="cleft" title="Карт осталось: I ступень — ${a} из ${DECK[1].length}, II ступень — ${b} из ${DECK[2].length}">🃏 ${a} · ${b}</span>`;
}

function boardHTML(T) {
  const list = ranked(T);
  const max = Math.max(1, ...list.map(x => x.t.total));
  const top = list.slice(0, 3);
  const order = [top[1], top[0], top[2]];
  const cls = {1:'g', 2:'s', 3:'b'};
  const medal = {1:'🥇', 2:'🥈', 3:'🥉'};
  const podium = list.length >= 2 ? `<div class="podium">${order.map((x, i) => x ? `
      <div class="pod armor ${cls[x.place] || ''}" data-pod="${x.p.id}">
        <div class="medal">${x.place === 1 && x.t.total > 0 ? '<span class="crown">👑</span>' : ''}${medal[x.place] || x.place}</div>
        <div class="nm">${esc(x.p.name)}</div>
        <div class="sc" data-count="${x.p.id}" data-v="${x.t.total}">${fmt(x.t.total)}</div><div class="lbl">очков</div>
        <div class="base">${x.place}</div>
      </div>` : '<div></div>').join('')}</div>` : '';
  const tt = titles(T);
  return podium + `<div class="ltable armor">
    <div class="lt-row head"><div>#</div><div>Танкист</div><div class="num hide-m">I ступень</div><div class="num hide-m">II ступень</div><div class="num hide-m">Финал</div><div class="num hide-m">Карты I · II</div><div class="num">Итого</div></div>
    ${list.map(({p, t, place}) => `
      <div class="lt-row r${place}" data-pid="${p.id}">
        <div class="rk">${place}</div>
        <div><div class="nm">${esc(p.name)}${tt[p.id].map(b => `<span class="badge">${b}</span>`).join('')}</div><div class="bar"><i style="width:${Math.max(0, t.total / max * 100)}%"></i></div></div>
        <div class="num hide-m">${fmt(t.s1)}</div>
        <div class="num hide-m">${fmt(t.s2)}</div>
        <div class="num hide-m">${fmt(t.s3)}</div>
        <div class="num hide-m">${leftHTML(p.id)}</div>
        <div class="tot" data-count="${p.id}" data-v="${t.total}">${fmt(t.total)}</div>
      </div>`).join('')}
  </div>`;
}

function modsHTML(x) { return x.mods.map(m => ` <span class="${m.c}">${m.t}</span>`).join(''); }
function ptsHTML(x, stage) {
  if (!x) return '<span class="muted">—</span>';
  const lm = stage === 3 ? x.mult / FINAL_X : x.mult;
  let calc = '';
  if (lm !== 1) calc += ' × ' + lm.toFixed(1);
  if (stage === 3) calc += ` × ${FINAL_X} 🔥`;
  if (calc || x.mods.length) calc = fmt(x.eff) + calc;
  return `<b>${fmt(x.pts)}</b><span class="calc">${calc}${modsHTML(x)}</span>`;
}

function cardName(id, tgt) { const k = CARDS[id]; return `${k.i} ${k.n}${tgt ? ' → ' + esc(pName(tgt)) : ''}`; }
function cardSlot(r, p) {
  if (r.stage === 3) return '<span class="muted" style="font-size:12px">без карт</span>';
  const c = cell(r, p.id), k = cardOf(r, p.id);
  if (k) return `<span class="cardchip" title="${esc(CARDS[k].d)}">${cardName(k, CARDS[k].target && c.tgt)}${VIEW ? '' : `<button class="x" data-unplay="${r.id}:${p.id}" title="Убрать карту">✕</button>`}</span>`;
  if (VIEW) return '<span class="muted" style="font-size:12px">—</span>';
  const open = PICK?.rid === r.id && PICK?.pid === p.id;
  const left = DECK[r.stage].filter(id => !whyNot(r, p.id, id)).length;
  return `<button class="small cardbtn ${open ? 'on' : ''}" data-pick="${r.id}:${p.id}" ${left || open ? '' : 'disabled'}>🃏 Карта <small>${left}</small></button>`;
}
function pickerHTML(r, p) {
  if (VIEW || PICK?.rid !== r.id || PICK?.pid !== p.id) return '';
  if (PICK.card) {
    const k = CARDS[PICK.card];
    return `<div class="picker tg"><span class="pk-l">${k.i} ${k.n} — против кого?</span>${availTargets(r, p.id).map(o => `<button class="small" data-tgt="${o.id}">${esc(o.name)}</button>`).join('')}<button class="small ghost" data-pickback>← назад</button></div>`;
  }
  const ids = DECK[r.stage].filter(id => !playedIn(p.id, r.stage, id, r.id));
  return `<div class="picker">${ids.map(id => { const why = whyNot(r, p.id, id), k = CARDS[id]; return `
    <button class="copt" data-play="${id}" ${why ? 'disabled' : ''} title="${esc(why || k.d)}"><span class="ci">${k.i}</span><span class="cn">${k.n}</span><span class="cd">${why || k.d}</span></button>`; }).join('')}
    ${ids.length ? '' : '<span class="muted">Все карты ступени уже сыграны</span>'}</div>`;
}
function xrowHTML(r, p) {
  const c = cell(r, p.id), parts = [];
  for (const f of needsOf(r)) parts.push(`<label class="xin">${STAT[f].i} ${STAT[f].n}<input type="number" inputmode="numeric" value="${esc(c[f] ?? '')}" data-rid="${r.id}" data-pid="${p.id}" data-f="${f}" ${VIEW ? 'disabled' : ''}></label>`);
  if (cardOf(r, p.id) === 'turtle') parts.push(`<label class="bet"><input type="checkbox" data-rid="${r.id}" data-pid="${p.id}" data-f="alive" ${c.alive ? 'checked' : ''} ${VIEW ? 'disabled' : ''}> 🐢 выжил до конца</label>`);
  return parts.length ? `<div class="xrow">${parts.join('')}</div>` : '';
}

function isPlayed(r) { const f = needsOf(r); return S.players.every(p => num(cell(r, p.id).exp) != null && f.every(k => num(cell(r, p.id)[k]) != null)); }

// "Только фугасы" — общая карта: действует на весь бой, на всех игроков
function heBanner(r) {
  const who = S.players.find(p => cardOf(r, p.id) === 'he');
  return who ? `<div class="heban">🧨 <b>Весь бой — только фугасы!</b> <span class="muted">(карта: ${esc(who.name)})</span> На фугасах едут все, первый по опыту получает ×1.5.</div>` : '';
}
function roundCard(r, R, T, title, extra = '') {
  const c = r.stage === 2 ? cat(r.catId) : null;
  if (r.closed && isPlayed(r)) {
    const xs = S.players.map(p => ({p, x: R[r.id][p.id]})).sort((a, b) => b.x.pts - a.x.pts || b.x.exp - a.x.exp);
    return `
      <div class="round armor closed" data-card="${r.id}">
        <div class="rhead"><h3>${title}</h3><span class="tag ok">✔ записан</span>${VIEW ? '' : `<button class="small ghost" data-open="${r.id}" title="Редактировать">✏️</button>`}</div>${heBanner(r)}
        <div class="sum">${xs.map((o, i) => `
          <div class="sp ${i === 0 ? 'top' : ''}">
            <span class="m">${['🥇','🥈','🥉'][i] || i + 1}</span>
            <span class="n">${esc(o.p.name)}${o.p.id === r.chooser && c?.unique ? ` <small>(на ${esc(c.name)})</small>` : ''}</span>
            <span class="e">${o.x.card ? `<span class="cb ${o.x.cs}">${cardName(o.x.card, o.x.tgt)}</span> ` : ''}${fmt(o.x.exp)} опыта${modsHTML(o.x)}</span>
            <b>${fmt(o.x.pts)}</b>
          </div>`).join('')}</div>
        <div class="quip">💬 ${quip(r, R)}</div>
      </div>`;
  }
  return `
    <div class="round armor" data-card="${r.id}">

function quip(r, R) {
  const xs = S.players.map(p => ({p, x: R[r.id][p.id]})).filter(o => o.x);
  if (!xs.length) return '';
  const by = [...xs].sort((a, b) => b.x.exp - a.x.exp);
  const best = by[0], worst = by[by.length - 1];
  let h = 7; for (const ch of r.id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const pick = arr => arr[h % arr.length];
  const n = o => `<b>${esc(o.p.name)}</b>`;
  const c = r.stage === 2 ? cat(r.catId) : r.stage === 3 ? pickCat(r) : null;
  const out = [];
  if (r.stage === 3) { const ch = xs.find(o => o.p.id === r.chooser) || best; out.push(pick([`Финальный выбор ${n(ch)}: ${esc(pickLabel(r))}. Ставки сделаны, господа 🎬`, `Финал: «${esc(pickLabel(r))}» по заявке ${n(ch)} — всё ×2 🔥`])); }
  const duel = xs.find(o => o.x.card === 'duel' && o.x.duel);
  if (duel) { const d = duel.x.duel, w = xs.find(o => o.p.id === d.w), l = xs.find(o => o.p.id === d.l); out.push(pick([`⚔️ Дуэль за ${n(w)}: ${n(l)} отдаёт ${fmt(d.tr)} очков`, `⚔️ ${n(w)} выигрывает дуэль, ${n(l)} платит четвертью очков`])); }
  const sw = xs.find(o => o.x.card === 'swap' && o.x.tgt);
  if (sw) { const o = xs.find(q => q.p.id === sw.x.tgt); if (o) out.push(sw.x.eff > sw.x.exp ? `🔄 Обмен сработал: ${n(sw)} забирает опыт ${n(o)} — гениально или подло?` : `🔄 Обмен вышел боком: ${n(sw)} отдал свои ${fmt(sw.x.exp)} опыта ${n(o)} 🤦`); }
  if (xs.some(o => o.x.card === 'he')) out.push(pick([`🧨 Только фугасы! Броня плакала, модули горели`, `🧨 Фугасный бой: кто пробил — тот молодец, кто нет — тот «сплешил»`]));
  const win = xs.find(o => o.x.status === 'win'), lose = xs.find(o => o.x.status === 'lose');
  if (win) out.push(pick([`Ставка ${n(win)} зашла — ×2! Казино на гусеницах 🎰`, `${n(win)}: ва-банк удался, очки удвоены 💰`, `${n(win)} знает толк в ставках. ×2 и заслуженно 🎲`]));
  if (lose) out.push(pick([`Ставка ${n(lose)} — рикошет прямо в кошелёк. ×0 💸`, `${n(lose)}: «я буду первым» — сказано громко, сыграно тихо 🤫`, `Минус ${fmt(lose.x.base)} очков для ${n(lose)}. Казино всегда побеждает 🎲`]));
  if (best.x.exp >= 3000) out.push(pick([`${n(best)}: ${fmt(best.x.exp)} опыта — это уже не бой, а расстрел 🔥`, `${n(best)} в режиме «тащер» — ${fmt(best.x.exp)} опыта 💪`]));
  if (xs.length > 1 && by[0].x.exp - by[1].x.exp < 100) out.push(`Фотофиниш: ${n(by[0])} и ${n(by[1])} разошлись всего на ${fmt(by[0].x.exp - by[1].x.exp)} опыта 📸`);
  if (xs.length > 1 && worst.x.exp < 400) out.push(pick([`${n(worst)} — ${fmt(worst.x.exp)} опыта. Ангар соскучился 🥔`, `${n(worst)}: загрузка боя длилась дольше, чем сам бой 🥔`, `${n(worst)}: тактическое отступление в ангар 🏳️`]));
  else if (xs.length > 1 && worst.x.exp > 0 && best.x.exp >= worst.x.exp * 3) out.push(`Разрыв ×${Math.floor(best.x.exp / worst.x.exp)}: ${n(best)} — ${fmt(best.x.exp)}, ${n(worst)} — ${fmt(worst.x.exp)} 📏`);
  const flavor = {
    art: [`Арта: «вжух — и минус треть ХП». Чат в ярости 💥`, `Где-то в рандоме плачет ТТшка от сплеша 😢`],
    lt: [`ЛТ: светить, крутиться, не умирать. Классика 👀`, `Кусты одобряют этот светляк 🌿`],
    kv2: [`КВ-2: один выстрел — одна молитва 🙏`, `152 мм надежды и 0 мм точности 🎯`],
    bt7: [`БТ-7 арт.: пушка больше танка — и это прекрасно 🤡`],
    sth: [`Сверхтяж: броня толще, чем аргументы в чате 🧱`],
    pt: [`ПТ: стоять в кустах — тоже искусство 🌳`],
    tt: [`ТТ: танковать лбом — дело чести 🛡️`],
    st: [`СТ: быстро приехал, быстро нагнул, быстро уехал 🏎️`],
  };
  if (c && flavor[c.id]) out.push(pick(flavor[c.id]));
  if (r.stage === 1 && r.lvl <= 4) out.push(pick([`Песочница: тут ещё все добрые 🏖️`, `Низкие уровни: мало опыта, много веселья 🐣`]));
  if (r.stage === 1 && r.lvl === 10) out.push(`10 уровень — тут уже без шуток. Почти 🎖️`);
  if (out.length < 2) out.push(pick([`Бой забирает ${n(best)}. Экипаж доволен 🎖️`, `Лучший в бою — ${n(best)}. Медаль «За храбрость» уже в пути 🏅`, `${n(best)} сегодня главный по пробитиям 🎯`]));
  return out.slice(0, 2).join(' · ');
}

function titles(T) {
  const R = compute().R;
  const tops = {}, won = {}, lost = {};
  for (const r of S.rounds) {
    const xs = S.players.map(p => ({p, x: R[r.id][p.id]})).filter(o => o.x);
    if (xs.length === S.players.length && isPlayed(r)) { const b = xs.reduce((a, o) => o.x.exp > a.x.exp ? o : a); tops[b.p.id] = (tops[b.p.id] || 0) + 1; }
    for (const o of xs) { if (o.x.status === 'win') won[o.p.id] = 1; if (o.x.status === 'lose') lost[o.p.id] = 1; }
  }
  const list = ranked(T), out = {};
  const maxTops = Math.max(0, ...Object.values(tops));
  for (const {p, t, place} of list) {
    const b = [];
    if (place === 1 && t.total > 0) b.push('👑 Командир взвода');
    if (list.length >= 3 && place === list.length && t.total > 0) b.push('🥔 Картофельный барон');
    if (tops[p.id] >= 2 && tops[p.id] === maxTops) b.push(`🔥 Нагибатор · ${tops[p.id]} топов`);
    if (won[p.id]) b.push('🎰 Везунчик');
    if (lost[p.id]) b.push('💸 Спонсор казино');
    out[p.id] = b.slice(0, 3);
  }
  return out;
}

/* ---------------- light refresh (keeps input focus) ---------------- */
function refresh() {
  const {R, T} = compute();
  const before = captureBoard();
  $('#board').innerHTML = boardHTML(T);
  animateBoard(before, T, false);
  for (const el of document.querySelectorAll('[data-out]')) {
    const [rid, pid] = el.dataset.out.split(':');
    const r = S.rounds.find(x => x.id === rid);
    el.innerHTML = ptsHTML(R[rid][pid], r.stage);
  }
  for (const el of document.querySelectorAll('[data-record]')) {
    el.disabled = !isPlayed(S.rounds.find(x => x.id === el.dataset.record));
  }
}

/* ---------------- events ---------------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (VIEW || !['exp', ...Object.keys(STAT)].includes(t.dataset.f)) return;
  const r = S.rounds.find(x => x.id === t.dataset.rid);
  cell(r, t.dataset.pid)[t.dataset.f] = t.value;
  save(); refresh();
});

document.addEventListener('change', e => {
  const t = e.target;
  if (VIEW) return;
  if (t.id === 'importFile') return importFile(t);
  const r = S?.rounds.find(x => x.id === t.dataset.rid);
  if (!r) return;
  if (t.dataset.f === 'alive') cell(r, t.dataset.pid).alive = t.checked;
  else if (t.dataset.rf) r[t.dataset.rf] = t.value;
  else return;
  save(); render();
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const names = f.getAll('player').map(s => s.trim()).filter(Boolean);
  if (!names.length) return;
  const limits = {1: 0, 2: 0, 3: 0}; // bets are cards now
  if (S && EDITING) {
    const old = S.players;
    S.players = names.map((n, i) => ({id: old[i]?.id || uid(), name: n}));
    S.name = f.get('name'); S.betLimits = limits;
    ensureStage1(S);
  } else {
    const players = names.map(n => ({id: uid(), name: n}));
    S = {v:1, name: f.get('name'), players, betLimits: limits, categories: defaultCats(players.length), rounds: []};
    ensureStage1(S);
    TAB = 1;
  }
  EDITING = false; save(); render();
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-del],[data-record],[data-open],[data-pick],[data-play],[data-tgt],[data-pickback],[data-unplay]');
  if (!t) return;
  if (t.dataset.act === 'fire') return fire(t);
  if (t.dataset.tab) { TAB = +t.dataset.tab; return render(); }
  if (t.dataset.act === 'addPlayer') {
    const pl = $('#plist'); pl.insertAdjacentHTML('beforeend', playerInput('', pl.children.length));
    pl.lastElementChild.querySelector('input').focus(); return;
  }
  if (t.dataset.act === 'delPlayer') { if ($('#plist').children.length > 1) { t.closest('.pi').remove(); renumber(); } return; }
  if (t.dataset.act === 'report') return download(reportMD(), (S.name || 'turnir') + ' — отчёт.md', 'text/markdown');
  if (VIEW) return;
  if (t.dataset.record) return recordRound(t.dataset.record);
  if (t.dataset.pick) {
    const [rid, pid] = t.dataset.pick.split(':');
    PICK = PICK?.rid === rid && PICK?.pid === pid ? null : {rid, pid}; return render();
  }
  if (t.dataset.pickback != null) { PICK.card = null; return render(); }
  if (t.dataset.play || t.dataset.tgt) {
    const r = S.rounds.find(x => x.id === PICK?.rid); if (!r) return;
    const id = t.dataset.play || PICK.card;
    if (t.dataset.play && CARDS[id].target) { PICK.card = id; return render(); }
    const c = cell(r, PICK.pid);
    c.card = id; c.tgt = t.dataset.tgt || null;
    const pid = PICK.pid; PICK = null; save(); render();
    toast(`${pName(pid)} играет карту ${CARDS[id].i} ${CARDS[id].n}${c.tgt ? ' против ' + pName(c.tgt) : ''}!`);
    cardFx(r.id, pid);
    return;
  }
  if (t.dataset.unplay) {
    const [rid, pid] = t.dataset.unplay.split(':');
    const c = cell(S.rounds.find(x => x.id === rid), pid);
    delete c.card; delete c.tgt; save(); return render();
  }
  if (t.dataset.open) {
    const r = S.rounds.find(x => x.id === t.dataset.open); r.closed = false; save(); render();
    document.querySelector(`[data-card="${r.id}"] input[data-f="exp"]`)?.focus();
    return;
  }
  if (t.dataset.del) {
    if (!confirm('Удалить этот бой?')) return;
    S.rounds = S.rounds.filter(r => r.id !== t.dataset.del); save(); return render();
  }
  const a = t.dataset.act;
  if (a === 'share') shareLink();
  if (a === 'edit') { EDITING = true; render(); }
  if (a === 'cancelEdit') { EDITING = false; render(); }
  if (a === 'export') {
    download(JSON.stringify(S, null, 2), (S.name || 'turnir') + '.json', 'application/json');
  }
  if (a === 'import') $('#importFile').click();
  if (a === 'reset') {
    if (!confirm('Начать новый турнир? Текущие результаты будут удалены (сначала сделай экспорт, если нужно).')) return;
    S = null; save(); render();
  }
});

function importFile(input) {
  const file = input.files[0]; if (!file) return;
  file.text().then(txt => {
    const d = JSON.parse(txt);
    if (!d.players || !d.rounds) throw 0;
    S = ensureStage1(d); EDITING = false; save(); render(); toast('Турнир загружен');
  }).catch(() => alert('Не удалось прочитать файл')).finally(() => input.value = '');
}


/* ---------------- record & animations ---------------- */
const RECORD_TOASTS = ['Бой записан. Экипаж, по машинам! 🚀', 'Записано! Ангар аплодирует 👏', 'Есть пробитие! Бой в протоколе 📝', 'Бой в истории. Следующий! ⚔️', 'Записал. Чат уже спорит, кто тащил 💬'];
function recordRound(id) {
  const r = S.rounds.find(x => x.id === id);
  if (!isPlayed(r)) return;
  r.closed = true; save(); render();
  toast(RECORD_TOASTS[Math.floor(Math.random() * RECORD_TOASTS.length)]);
  // jump to the next open battle of the same stage
  const next = document.querySelector(`.round:not(.closed) input[data-f="exp"]`);
  if (next) setTimeout(() => { next.closest('.round').scrollIntoView({behavior: 'smooth', block: 'center'}); next.focus({preventScroll: true}); }, 650);
}

document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key !== 'Enter' || !['exp', ...Object.keys(STAT)].includes(t.dataset?.f) || VIEW) return;
  e.preventDefault();
  const card = t.closest('.round');
  const ins = [...card.querySelectorAll('input[type=number][data-f]')];
  const i = ins.indexOf(t);
  if (i < ins.length - 1) { ins[i + 1].focus(); ins[i + 1].select(); }
  else recordRound(t.dataset.rid);
});

const PREV = {init: false, totals: {}, closed: new Set(), leader: null, bets: {}};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function captureBoard() {
  const rects = {};
  document.querySelectorAll('.lt-row[data-pid]').forEach(el => rects[el.dataset.pid] = el.getBoundingClientRect().top);
  const shown = {};
  document.querySelectorAll('[data-count]').forEach(el => shown[el.dataset.count] ??= +el.dataset.v);
  return {rects, shown};
}

function countUp(el, from, to) {
  if (reduceMotion || from === to) return;
  const t0 = performance.now(), d = 700;
  const step = now => {
    const k = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

function animateBoard(before, T, full) {
  if (!PREV.init) return;
  // FLIP: slide rows to their new place
  document.querySelectorAll('.lt-row[data-pid]').forEach(el => {
    const old = before.rects[el.dataset.pid];
    if (old == null || reduceMotion) return;
    const dy = old - el.getBoundingClientRect().top;
    if (Math.abs(dy) < 2) return;
    el.animate([{transform: `translateY(${dy}px)`}, {transform: 'none'}], {duration: 600, easing: 'cubic-bezier(.2,.8,.2,1)'});
    el.classList.add('moved'); setTimeout(() => el.classList.remove('moved'), 900);
  });
  document.querySelectorAll('[data-count]').forEach(el => {
    const from = before.shown[el.dataset.count];
    if (from != null) countUp(el, from, +el.dataset.v);
  });
}

function afterRender(before) {
  if (!S) { PREV.init = false; return; }
  const {R, T} = compute();
  animateBoard(before, T, true);
  const list = ranked(T);
  const leader = list[0] && list[0].t.total > 0 && (!list[1] || list[1].t.total < list[0].t.total) ? list[0].p.id : null;
  const closedNow = new Set(S.rounds.filter(r => r.closed && isPlayed(r)).map(r => r.id));
  if (PREV.init) {
    for (const id of closedNow) if (!PREV.closed.has(id)) stampCard(id, R);
    if (leader && PREV.leader && leader !== PREV.leader) newLeader(leader);
  } else if (!reduceMotion) {
    document.body.classList.add('first'); setTimeout(() => document.body.classList.remove('first'), 1600);
  }
  PREV.init = true; PREV.closed = closedNow; PREV.leader = leader ?? PREV.leader;
}

function stampCard(id, R) {
  const card = document.querySelector(`[data-card="${id}"]`);
  if (!card || reduceMotion) return;
  card.insertAdjacentHTML('beforeend', '<div class="stamp">ЗАПИСАНО</div>');
  card.classList.add('just');
  setTimeout(() => { card.querySelector('.stamp')?.remove(); card.classList.remove('just'); }, 1800);
  const res = Object.values(R[id] || {});
  if (res.some(x => x?.status === 'win' || (x?.card === 'duel' && x.cs === 'win'))) setTimeout(() => confetti(card), 350);
  if (res.some(x => x?.status === 'lose')) setTimeout(() => { card.classList.add('shake'); floaters(card, '💸'); setTimeout(() => card.classList.remove('shake'), 600); }, 350);
}

function cardFx(rid, pid) {
  if (reduceMotion) return;
  const el = document.querySelector(`[data-card="${rid}"] [data-unplay="${rid}:${pid}"]`)?.closest('.cardchip');
  if (!el) return;
  el.classList.add('flip');
  const c = cell(S.rounds.find(x => x.id === rid), pid).card;
  floaters(el, CARDS[c].i.slice(0, 2), 5);
}

function confetti(el, n = 60) {
  const b = el.getBoundingClientRect();
  const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
  const colors = ['#f2b01e', '#f5c542', '#7bd35f', '#ff5a3c', '#86b6ea', '#ece9d8'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('i');
    d.className = 'confetti';
    d.style.background = colors[i % colors.length];
    d.style.left = cx + 'px'; d.style.top = cy + 'px';
    document.body.appendChild(d);
    const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 260;
    d.animate([
      {transform: 'translate(0,0) rotate(0)', opacity: 1},
      {transform: `translate(${Math.cos(a) * v}px, ${Math.sin(a) * v - 80}px) rotate(${Math.random() * 720}deg)`, opacity: 1, offset: .6},
      {transform: `translate(${Math.cos(a) * v * 1.1}px, ${Math.sin(a) * v + 160}px) rotate(${Math.random() * 1080}deg)`, opacity: 0},
    ], {duration: 1400 + Math.random() * 600, easing: 'cubic-bezier(.2,.7,.4,1)'}).onfinish = () => d.remove();
  }
}

function floaters(el, emoji, n = 8) {
  const b = el.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const d = document.createElement('span');
    d.className = 'floater'; d.textContent = emoji;
    d.style.left = (b.left + Math.random() * b.width) + 'px'; d.style.top = (b.top + b.height * .6) + 'px';
    document.body.appendChild(d);
    d.animate([{transform: 'translateY(0)', opacity: 1}, {transform: `translateY(-${80 + Math.random() * 80}px)`, opacity: 0}], {duration: 1200 + Math.random() * 500, delay: i * 60, easing: 'ease-out', fill: 'both'}).onfinish = () => d.remove();
  }
}

function newLeader(pid) {
  const name = pName(pid);
  const el = document.createElement('div');
  el.className = 'leader-pop';
  el.innerHTML = `<div class="lp-k">Смена лидера</div><div class="lp-n">👑 ${esc(name)}</div>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
  const pod = document.querySelector(`[data-pod="${pid}"]`);
  if (pod) confetti(pod, 40);
}

let shots = 0;
function fire(tank) {
  const hero = tank.closest('.hero');
  const b = tank.getBoundingClientRect(), hb = hero.getBoundingClientRect();
  const y = b.top - hb.top + b.height * 0.31;
  const x = b.left - hb.left + 4;
  hero.insertAdjacentHTML('beforeend', `<span class="flash" style="left:${x - 30}px;top:${y - 30}px"></span><span class="shell" style="left:${x}px;top:${y - 3}px"></span><span class="bah" style="left:${Math.max(10, x - 180)}px;top:${y - 40}px">БАХ!</span>`);
  const shell = hero.querySelector('.shell:last-of-type');
  shell.animate([{transform: 'translateX(0)'}, {transform: `translateX(-${x + 40}px)`}], {duration: 450, easing: 'linear', fill: 'forwards'});
  hero.classList.remove('recoil'); void hero.offsetWidth; hero.classList.add('recoil');
  setTimeout(() => hero.querySelectorAll('.flash,.shell,.bah').forEach(n => n.remove()), 900);
  shots++;
  if (shots === 5) toast('Хватит стрелять по своим! 🚫');
  if (shots === 10) toast('Тебе бан за тимкилл 😤');
  if (shots === 20) { toast('Ладно, держи конфетти 🎉'); confetti(hero, 80); }
}

let radioI = 0;
setInterval(() => {
  const el = $('#radio'); if (!el) return;
  el.classList.add('out');
  setTimeout(() => { radioI = (radioI + 1) % RADIO.length; el.textContent = RADIO[radioI]; el.classList.remove('out'); }, 350);
}, 7000);

/* ---------------- boot ---------------- */
document.addEventListener('click', e => {
  if (!e.target.closest('#sync') || VIEW) return;
  const cls = $('#sync').className;
  if (cls.includes('auth')) adminKey(true);
  if (cls.includes('auth') || cls.includes('err')) push();
});

async function boot() {
  const wantAdmin = new URLSearchParams(location.search).has('admin');
  let remote = null;
  try { remote = await fetchRemote(); API_OK = true; lastRemote = JSON.stringify(remote); } catch (e) { API_OK = false; }
  if (API_OK && !wantAdmin) {
    // viewer: read-only, auto-refresh
    VIEW = true; S = ensureStage1(remote); render(); setSync('live'); startPolling();
    return;
  }
  VIEW = false;
  const local = loadLocal();
  // take whichever copy is newer (lets the host continue from another device)
  S = ensureStage1((remote?.updatedAt || 0) > (local?.updatedAt || 0) ? remote : local);
  render();
  if (API_OK) { adminKey(); setSync('ok'); if (S && S !== remote) save(); }
  else setSync('off');
}
boot();
</script>
